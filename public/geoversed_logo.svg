<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none" width="100%" height="100%">
  <!-- GEOVERSED Official Corporate Logo -->
  <g transform="translate(2, 4)">
    <!-- Stylized "A" Monogram & Surveyor Compass Symbol -->
    
    <!-- Lower Left Navy Wing -->
    <path 
      d="M 4 58 L 2 58 L 17 26 L 24 38 L 16 51 L 20 58 L 4 58 Z" 
      fill="#1A3258" 
    />
    
    <!-- Upper Peak & Right Downward Leg (Warm Bronze) -->
    <path 
      d="M 28 5 L 34 5 L 59 58 L 44 58 L 39 46 L 27 46 L 23 52 L 28 52 L 24 58 L 15 58 L 30 27 L 34 27 L 25 41 L 37 41 L 31 28 L 28 5 Z" 
      fill="#946E44" 
    />

    <!-- Surveyor Reticle / Geospatial Crosshairs Target -->
    <g transform="translate(47, 23)">
      <!-- Outer Bronze Circle -->
      <circle cx="0" cy="0" r="14" stroke="#946E44" stroke-width="2.5" fill="none" />
      
      <!-- 4 Cardinal Crosshair Sight Lines -->
      <line x1="0" y1="-19" x2="0" y2="-13" stroke="#946E44" stroke-width="2.2" stroke-linecap="square" />
      <line x1="0" y1="13" x2="0" y2="19" stroke="#946E44" stroke-width="2.2" stroke-linecap="square" />
      <line x1="-19" y1="0" x2="-13" y2="0" stroke="#946E44" stroke-width="2.2" stroke-linecap="square" />
      <line x1="13" y1="0" x2="19" y2="0" stroke="#946E44" stroke-width="2.2" stroke-linecap="square" />

      <!-- Inner Navy Ring -->
      <circle cx="0" cy="0" r="9.2" stroke="#1A3258" stroke-width="2.2" fill="none" />
      
      <!-- Center Bullseye Sighting Point -->
      <circle cx="0" cy="0" r="3" fill="#1A3258" />
    </g>
  </g>

  <!-- Typography Block -->
  <g transform="translate(76, 0)">
    <!-- Main Brand Name: GEOVERSED -->
    <text 
      x="0" 
      y="37" 
      font-family="'Poppins', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="800" 
      font-size="31" 
      fill="#1A3258" 
      letter-spacing="0.04em"
    >GEOVERSED</text>
    
    <!-- Subtitle: Smart Solution Pvt. Ltd. -->
    <text 
      x="1" 
      y="58" 
      font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="500" 
      font-size="15" 
      fill="#946E44" 
      letter-spacing="0.01em"
    >Smart Solution Pvt. Ltd.</text>
  </g>
</svg>
